<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta decription="CV MAKER" content="make your profissional cv">
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="../js/starter.js" defer></script>
  </head>
  <body class="min-h-screen flex items-center justify-center overflow-x-hidden bg-[url(https://ideogram.ai/assets/progressive-image/balanced/response/XD9OqnF9RfeC1DZ2PPLqnw)] bg-no-repeat bg-cover bg-center">
   
    <div class="w-[90%] max-w-[700px] grid gap-[50px]  h-auto bg-blue-100 ">
      <h1 class="text-center bg-gray-200 w-[100%] h-[40px] flex items-center justify-center text-xl rounded-md ">MAKE YOUR PROFISSIONAL CV</h1>
      <div class="progress-container relative ">
        <div
          class="progress-bar w-[100%] h-[4px] bg-black  absolute top-1/2 transform translate-y-[-50%] "
        >
        
          <div
            class="progress w-[0%] h-[100%] absolute bg-gray-200 transform    transition duration-300 "
          ></div>
        </div>
        <ol class="steps flex justify-between z-[4]">
          <li
            class="step w-[50px] h-[50px] rounded-full bg-white flex items-center justify-center text-lg transition-all duration-300 transform-none border z-[5]"
          >
            <span class="number">1</span>
          </li>
          <li
            class=" step w-[50px] h-[50px] rounded-full bg-white flex items-center justify-center text-lg transition-all duration-300 transform-none border z-[5]"
          >
            <span class="number2">2</span>
          </li>
          <li
            class="step w-[50px] h-[50px] rounded-full bg-white flex items-center justify-center text-lg transition-all duration-300 transform-none border z-[5]"
          >
            <span class="number">3</span>
          </li>
          <li
            class="step w-[50px] h-[50px] rounded-full bg-white flex items-center justify-center text-lg transition-all duration-300 transform-none border z-[5]"
          >
            <span class="number">4</span>
          </li>
          <li
            class="step w-[50px] h-[50px] rounded-full bg-white flex items-center justify-center text-lg transition-all duration-300 transform-none border z-[5]"
          >
            <span class="number">5</span>
          </li>
        </ol>
      </div>

      <div class="nav-buttons flex items-center justify-center gap-[50px]">
        <button
          class="prev cursor-pointer rounded-md px-10 py-2 text-[white] bg-red-500"
        >
          prev
        </button>
        <button
          class="next cursor-pointer rounded-md px-10 py-2 text-[white] bg-blue-500"
        >
          next
        </button>
      </div>
    </div>
  </body>
</html>
